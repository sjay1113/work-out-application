<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT 운동 노트</title>
<meta name="theme-color" content="#3a7894">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PT 노트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Nanum+Pen+Script&display=swap">
</head>
<body>
<style>
/* Layout: phone-first app shell — page column + bottom tab bar; a full-screen workout logger (set table, auto rest timer) and bottom sheets for details. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --surface-2:#eef1f3; --surface-3:#e2e7ea; --ink:#111a1f; --ink-2:#3a474f; --muted:#68777f; --line:#e3e8eb;
  --hero:#15222b; --hero-2:#1f303b; --hero-ink:#f3f6f7; --hero-muted:#a3b3bc;
  --ok:#1f8a4c; --on-ok:#ffffff; --ok-bg:#e6f4eb; --red:#c8352b; --pen:#2541a6; --pen-bg:#eef1fb;
  --p-s:#2a78d6; --p-l:#eb6834; --p-c:#1baf7a; --p-b:#eda100; --p-ot:#7c8a92;
  --paper:#ffffff; --paper-ink:#55636d; --paper-line:#e3e8ec;
  --skin:#f5c9a6; --skin-2:#e2aa83; --pants:#34414d; --pants-2:#25303a; --hair:#3b2a22; --shoe:#ffffff; --outline:#22303a;
  --shadow:0 1px 2px rgb(16 24 32 / .05),0 6px 18px rgb(16 24 32 / .05);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","IBM Plex Sans KR",system-ui,sans-serif;
  --f-pen:"Nanum Pen Script","IBM Plex Sans KR",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f12; --surface:#141a1e; --surface-2:#1b2328; --surface-3:#25313a; --ink:#eef3f5; --ink-2:#c3cdd2; --muted:#8b9aa2; --line:#232d33;
  --hero:#1a2731; --hero-2:#24343f; --hero-ink:#f3f6f7; --hero-muted:#a3b3bc;
  --ok:#3fbf74; --on-ok:#06140b; --ok-bg:#15291d; --red:#ff7a6e; --pen:#aab9ff; --pen-bg:#1c2443;
  --p-s:#3987e5; --p-l:#d95926; --p-c:#199e70; --p-b:#c98500; --p-ot:#8b9aa2;
  --skin:#eab894; --skin-2:#cf9b74; --pants:#4b5a68; --pants-2:#36424e; --hair:#8a6149; --shoe:#e6ebee; --outline:#06090b;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0f12; --surface:#141a1e; --surface-2:#1b2328; --surface-3:#25313a; --ink:#eef3f5; --ink-2:#c3cdd2; --muted:#8b9aa2; --line:#232d33;
  --hero:#1a2731; --hero-2:#24343f; --hero-ink:#f3f6f7; --hero-muted:#a3b3bc;
  --ok:#3fbf74; --on-ok:#06140b; --ok-bg:#15291d; --red:#ff7a6e; --pen:#aab9ff; --pen-bg:#1c2443;
  --p-s:#3987e5; --p-l:#d95926; --p-c:#199e70; --p-b:#c98500; --p-ot:#8b9aa2;
  --skin:#eab894; --skin-2:#cf9b74; --pants:#4b5a68; --pants-2:#36424e; --hair:#8a6149; --shoe:#e6ebee; --outline:#06090b;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--p-s);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:520px;margin:0 auto}
main .col{padding-block:20px 112px;display:flex;flex-direction:column;gap:22px}

/* page header */
.ph{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.ph h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;text-wrap:balance}
.ph .sub{font-size:14px;color:var(--muted)}
.ph h1 .pc{color:var(--pc)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.link{font-size:14px;color:var(--muted);font-weight:500}

/* tag */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:99px;background:color-mix(in srgb,var(--pc) 15%,var(--surface));color:var(--ink);white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--pc)}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--pc);opacity:.22;pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.hero .tag{background:rgb(255 255 255 / .1);color:var(--hero-ink)}
.hero .muted{font-size:13px;color:var(--hero-muted)}
.hero h2{font-size:24px;font-weight:700;letter-spacing:-.02em;position:relative}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.stats3>div{background:var(--hero-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stats3 b{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.1}
.stats3 span{font-size:12px;color:var(--hero-muted)}
.hero-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.hero-list li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid rgb(255 255 255 / .09)}
.hero-list .hn{font-family:var(--f-num);color:var(--hero-muted);font-weight:600}
.hero-list .hx{font-weight:600;min-width:0}
.hero-list .hv{font-family:var(--f-num);font-size:15px;color:var(--hero-muted);text-align:right}
.hero-act{display:grid;grid-template-columns:1fr auto;gap:8px;position:relative}
.btn-primary{background:var(--hero-ink);color:var(--hero);border-radius:14px;padding:14px 16px;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost{border:1.5px solid rgb(255 255 255 / .22);color:var(--hero-ink);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px}
.done-note{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--hero-ink);background:var(--hero-2);border-radius:12px;padding:10px 12px;position:relative}
.done-note svg{flex:none;color:var(--ok)}

/* cards & lists */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.rot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rot button{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.rot button[aria-pressed="true"]{border:2px solid var(--pc);padding:11px 5px 9px}
.rot .bar-top{width:22px;height:4px;border-radius:2px;background:var(--pc);margin-bottom:4px}
.rot strong{font-size:16px}
.rot span{font-size:12px;color:var(--muted)}
.rot em{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);padding:1px 7px;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-num);font-size:28px;font-weight:700;line-height:1.1}
.tile b small{font-family:var(--f-body);font-size:13px;font-weight:600;margin-left:2px}
.tile span{font-size:12.5px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 16px;text-align:left;width:100%;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.dbox{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);height:48px}
.dbox b{font-family:var(--f-num);font-size:20px;font-weight:700;line-height:1}
.dbox span{font-size:11px;color:var(--muted)}
.smain{min-width:0;display:flex;flex-direction:column;gap:4px}
.smain .tag{align-self:flex-start}
.smain p{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sright{font-family:var(--f-num);font-size:15px;color:var(--muted);display:flex;align-items:center;gap:6px}
.month{font-size:14px;font-weight:700;color:var(--muted);margin:6px 2px -2px}

/* library */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px 12px 40px;font:inherit;font-size:16px;color:var(--ink);background-image:none}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips-scroll{overflow-x:auto;margin:0 -2px;padding:2px;scrollbar-width:none}
.chips{display:flex;gap:6px;width:max-content}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chips button i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0}
.thumb{width:64px;height:48px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:100%}
.thumb text{display:none}
.thumb b{font-size:18px;color:var(--pc)}
.xmain{min-width:0}
.xmain strong{display:block;font-size:15.5px;font-weight:600}
.xmain span{font-size:13px;color:var(--muted)}
.chev{color:var(--muted)}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .col{display:grid;grid-template-columns:repeat(3,1fr)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav svg{width:24px;height:24px}

/* workout */
.wo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.wo-top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.wo-bar{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;padding-block:10px 8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--surface-2)}
.wo-title{display:flex;flex-direction:column;align-items:center;min-width:0}
.wo-title strong{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wo-title span{font-size:13px;color:var(--muted)}
.btn-finish{background:var(--ok);color:var(--on-ok);border-radius:12px;padding:9px 16px;font-weight:700;font-size:15px}
.pbar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.wo-body .col{padding-block:16px 140px;display:flex;flex-direction:column;gap:14px}
.wex{padding:16px 14px 12px;display:flex;flex-direction:column;gap:10px}
.wex-h{display:flex;align-items:flex-start;gap:10px}
.wex-h .n{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;background:color-mix(in srgb,var(--pc) 16%,var(--surface));color:var(--ink)}
.wex.alldone .wex-h .n{background:var(--ok);color:var(--on-ok)}
.wex-h h3{flex:1;min-width:0;font-size:17px;font-weight:700;line-height:1.35;padding-top:2px}
.how{flex:none;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:99px;padding:6px 12px;display:inline-flex;align-items:center;gap:4px}
.flag{font-size:12.5px;color:var(--red);margin-top:2px;font-weight:500}
.memo-line{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--pen-bg);border-radius:12px;padding:8px 12px;width:100%}
.memo-line b{font-family:var(--f-pen);font-size:20px;line-height:1.05;color:var(--pen);font-weight:400;flex:none}
.memo-line span{font-size:13.5px;color:var(--pen);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stbl{display:flex;flex-direction:column;gap:4px}
.st{display:grid;grid-template-columns:30px minmax(0,1fr) 66px 54px 44px;gap:6px;align-items:center;border-radius:10px;padding:3px 4px}
.st.hd{font-size:11.5px;color:var(--muted);font-weight:600;padding-block:0}
.st.hd span{text-align:center}
.st.hd span:nth-child(2){text-align:left}
.st .sn{font-family:var(--f-num);font-weight:700;text-align:center;color:var(--muted)}
.st .pv{font-family:var(--f-num);font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{width:100%;height:38px;border:0;border-radius:9px;background:var(--surface-2);text-align:center;font-family:var(--f-num);font-weight:600;font-size:17px;color:var(--ink);padding:0 2px}
.chk{width:44px;height:38px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.st.done{background:var(--ok-bg)}
.st.done .cell{background:transparent}
.st.done .chk{background:var(--ok);color:var(--on-ok)}
.st.done .sn{color:var(--ok)}
.hist{font-size:13px;color:var(--muted)}
.hist b{font-family:var(--f-num);color:var(--ink-2);font-weight:600}

/* rest */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:35;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.rest .col{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgb(0 0 0 / .25)}
.rest-in{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rest-l{font-size:13px;color:var(--hero-muted);display:block}
.rest-n{font-size:34px;font-weight:700;line-height:1}
.rest-btns{display:flex;gap:6px}
.rest-btns button{background:var(--hero-2);color:var(--hero-ink);border-radius:10px;padding:9px 11px;font-weight:600;font-size:14px}
.rest-bar{height:4px;background:var(--hero-2);border-radius:2px;overflow:hidden}
.rest-bar i{display:block;height:100%;background:var(--hero-ink);width:100%}
.rest.end .rest-n{color:var(--ok)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgb(0 0 0 / .45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-6px;background:var(--bg);padding:6px 0 10px;z-index:1}
.sheet-h h2{font-size:20px;font-weight:700;letter-spacing:-.01em;min-width:0}
.sheet-b{display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.kv b{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.1}
.kv span{font-size:12px;color:var(--muted)}
.note{background:var(--pen-bg);border-radius:14px;padding:12px 14px;color:var(--pen);font-size:15px;line-height:1.65}
.note .nd{display:block;font-family:var(--f-pen);font-size:21px;line-height:1.1;margin-bottom:2px}
.lrow{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px}
.lrow:first-child{border-top:0}
.lrow b{font-family:var(--f-num);font-weight:700}
.lrow span{font-family:var(--f-num);color:var(--ink-2)}
.ex-list .lrow{grid-template-columns:1fr auto}
.ex-list .lrow strong{font-family:var(--f-body);font-weight:600}
.btn-dark{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:700;font-size:16px;width:100%}
.btn-light{background:var(--surface-2);color:var(--ink);border-radius:14px;padding:13px;font-weight:600;font-size:15px;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{padding:8px 0;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.pick{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.pick:first-child{border-top:0}
.pick[aria-pressed="true"]{background:color-mix(in srgb,var(--pc) 10%,var(--surface))}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface-3)}
.pick[aria-pressed="true"] .radio{border:7px solid var(--ink)}
.msg{font-size:13px;color:var(--muted)}
.sum-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
.sum-hero .ring{width:64px;height:64px;border-radius:50%;background:var(--ok);color:var(--on-ok);display:grid;place-items:center}

/* chart */
.chart{padding:12px 10px 6px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-num);font-size:12px}
.chart .ln{stroke:var(--pc);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--pc);opacity:.1}
.chart .mk{fill:var(--pc);stroke:var(--surface);stroke-width:2}
.chart .lab{fill:var(--ink);font-family:var(--f-num);font-size:13px;font-weight:700}
.chart .hit{fill:transparent;cursor:pointer}
.chart .tip rect{fill:var(--ink)}
.chart .tip text{fill:var(--bg);font-family:var(--f-num);font-size:13px;font-weight:600}

const YEAR=2026,WD=['일','월','화','수','목','금','토'];

const pc=p=>`--pc:var(--p-${p})`;
S.forEach(s=>{s.pt=true;if(s.id!=='ot'){const[m,d]=s.d.split('/');s.date=new Date(YEAR,m-1,+d,12)}s.t=s.date?s.date.getTime():0});
/* ALL = 쌤과 한 PT 기록 + 혼자 한 내 기록(U), 시간순 */
let ALL=[],byId={},EX={},U=[];
function groupSets(sets){const out=[];sets.forEach(x=>{const w=String(x.w??'').slice(0,20),r=String(x.r??'').slice(0,10);const l=out[out.length-1];if(l&&l[0]===w&&l[2]===r)l[1]++;else out.push([w,1,r])});return out}
function logToSess(L){
  if(!L||typeof L.start!=='number'||!Array.isArray(L.ex))return null;
  const st=new Date(L.start);if(isNaN(st))return null;
  const ex=L.ex.filter(x=>x&&x.n&&Array.isArray(x.sets)).map(x=>({n:String(x.n).slice(0,40),r:groupSets(x.sets)})).filter(e=>e.r.length);
  if(!ex.length)return null;
  return{id:'u_'+L.id,uid:String(L.id),mine:true,d:`${st.getMonth()+1}/${st.getDate()}`,date:st,t:L.start,p:ORDER.includes(L.part)?L.part:'s',ex,ms:Math.max(0,(L.end||L.start)-L.start),from:L.from};
}
function rebuild(){
  ALL=[...S,...U.map(logToSess).filter(Boolean)].sort((a,b)=>a.t-b.t);
  byId={};EX={};
  ALL.forEach((s,i)=>{s.i=i;byId[s.id]=s;s.ex.forEach(e=>{(EX[e.n]=EX[e.n]||[]).push({s,e})})});
}
const kg=w=>{const m=String(w).match(/([\d.]+)\s*kg/);return m?+m[1]:null};
const repN=r=>parseInt(r)||0;
const setsOf=s=>s.ex.reduce((a,e)=>a+e.r.reduce((b,r)=>b+r[1],0),0);
const rowTxt=r=>r[2]===''?'워밍업':`${esc(r[0]||'맨몸')} · ${esc(r[2])}회×${r[1]}`;
const wdOf=s=>s.date?WD[s.date.getDay()]:'';

function memoFor(n,sess){
  const l=(EX[n]||[]).filter(x=>x.e.t).sort((a,b)=>b.s.i-a.s.i);
  const own=sess&&l.find(x=>x.s.id===sess.id);
  return own||l[0]||null;
}
/* 지난번 = 이 운동을 가장 최근에 했을 때(내 기록 포함)의 같은 세트 */
function prevFor(e,n){
  const pick=(EX[e.n]||[]).filter(x=>x.e.r.some(r=>r[2]!=='')).sort((a,b)=>b.s.i-a.s.i)[0];
  if(!pick)return null;
  const flat=pick.e.r.flatMap(r=>Array.from({length:r[1]},()=>r));
  const r=flat[n-1]||flat[flat.length-1];
  return{d:pick.s.d,mine:!!pick.s.mine,t:`${r[0]||'맨몸'}×${r[2]}`};
}
function curSess(){
  const list=sessionsOf(ui.part);
  if(!ui.sid||!list.some(s=>s.id===ui.sid))ui.sid=list[0].id;
  return byId[ui.sid];
}

function recommend(p,N,v){
  const picks=[];
  GROUPS[p].forEach(g=>{if(picks.length>=N)return;const c=g.filter(n=>!picks.includes(n)).sort((a,b)=>fam(b)-fam(a));if(c.length)picks.push(c[v%c.length])});
  if(picks.length<N)picks.push(...partEx(p).filter(n=>meta(n).k!=='W'&&!picks.includes(n)).slice(0,N-picks.length));
  return orderEx(picks);
}

function lastDefaults(n){
  const pick=(EX[n]||[]).filter(x=>x.e.r.some(r=>r[2]!=='')).sort((a,b)=>b.s.i-a.s.i)[0];
  if(!pick)return{w:'',r:12,sets:3,d:null};
  const main=pick.e.r.reduce((a,r)=>r[1]>=a[1]?r:a,pick.e.r[0]);
  const total=pick.e.r.reduce((a,r)=>a+r[1],0);
  return{w:main[0],r:repN(main[2])||12,sets:Math.min(5,Math.max(2,total)),d:pick.s.d};
}
function stepKg(w,dir){

}

function chartHtml(n){
  const pts=EX[n].slice().sort((a,b)=>a.s.i-b.s.i).map(x=>({d:x.s.d,v:Math.max(0,...x.e.r.map(r=>kg(r[0])||0))})).filter(p=>p.v>0);
  if(pts.length<2)return '';
  const W=320,H=170,L=38,R=18,T=26,B=30,max=Math.max(...pts.map(p=>p.v)),top=Math.max(5,Math.ceil(max*1.2/5)*5);
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(H-T-B)*(1-v/top);
  const grid=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${v}kg</text>`).join('');
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area=`${line} L${x(pts.length-1).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const mi=pts.findIndex(p=>p.v===max),li=pts.length-1;
  const showX=pts.length<=6?pts.map((_,i)=>i):[...new Set([0,mi,li])];
  const labIdx=[...new Set([mi,li])];
  return `<div class="card"><div class="chart-h"><strong>무게 변화</strong><span>세션별 가장 무거운 무게</span></div><div class="chart" data-chart>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(n)} 무게 변화: ${pts.map(p=>`${p.d} ${p.v}kg`).join(', ')}">${grid}
  <path d="${area}" class="area"/><path d="${line}" class="ln"/>
  ${showX.map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="ax">${pts[i].d}</text>`).join('')}
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" class="mk"/>`).join('')}
  ${labIdx.map(i=>`<text x="${x(i)}" y="${y(pts[i].v)-11}" text-anchor="middle" class="lab">${pts[i].v}kg</text>`).join('')}
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="16" class="hit" data-x="${x(i)}" data-y="${y(p.v)}" data-t="${p.d} · ${p.v}kg"/>`).join('')}
  <g class="tip" hidden><rect rx="6" height="24"/><text y="16" text-anchor="middle"></text></g></svg></div></div>`;
}
function showTip(hit){
  const svg=hit.ownerSVGElement,g=svg.querySelector('.tip'),t=g.querySelector('text'),r=g.querySelector('rect');
  t.textContent=hit.dataset.t;g.removeAttribute('hidden');
  const w=t.getComputedTextLength()+16,cx=Math.min(Math.max(+hit.dataset.x,w/2+2),320-w/2-2),cy=Math.max(+hit.dataset.y-40,0);
  r.setAttribute('width',w);r.setAttribute('x',-w/2);t.setAttribute('x',0);g.setAttribute('transform',`translate(${cx} ${cy})`);
}
function exSheet(n){

/* Supabase (깃허브 주소로 열었을 때만 사용). 공개용 키라 앱에 들어가도 괜찮아요 — 실제 보호는 DB의 '본인 기록만' 규칙이 해요. */

const Hist={
  kind:'local',col:null,sb:null,user:null,sbFailed:false,cloud:false,connecting:false,cloudDocs:[],
  pending(){const l=store.get('ptnote-history',[]);return Array.isArray(l)?l:[]},

  merge(){const ids=new Set(this.cloudDocs.map(x=>x.id));U=[...this.cloudDocs,...this.pending().filter(x=>!ids.has(x.id))]},
  async init(){
    if(window.claude&&typeof window.claude.use==='function')return this.initClaude();

  },
  /* claude.ai 링크: 내 claude.ai 계정의 개인 공간 */
  async initClaude(){
    this.kind='claude';this.connecting=true;refresh();
    let db=null,user=null;
    try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}

    const timer=setTimeout(()=>{if(!this.cloud){this.connecting=false;refresh()}},10000);
    let synced=false;
    this.col.onSnapshot(snap=>{
      this.cloudDocs=snap.docs.map(d=>d.data()).filter(x=>x&&typeof x.start==='number');
      if(!snap.metadata.fromCache){clearTimeout(timer);this.cloud=true;this.connecting=false;if(!synced){synced=true;this.upload()}}
      this.merge();refresh();
    },()=>{clearTimeout(timer);this.col=null;this.cloud=false;this.connecting=false;this.cloudDocs=[];this.merge();refresh()});
  },
  /* 깃허브 주소: Supabase 계정 (로그인했을 때만) */
  async initSupa(){
    this.kind='supa';
    try{if(!window.supabase)await loadScript(SUPA.js)}catch(e){this.sbFailed=true;refresh();return}
    try{this.sb=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){this.sbFailed=true;refresh();return}
    this.sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>this.onSession(session),0)});
    /* 로그인 화면 없이: 처음 열 때 이 휴대폰 전용 익명 계정을 자동으로 만들어요 (Supabase에서 익명 로그인을 켜 둬야 해요) */

  async onSession(session){

    if(!u){this.cloud=false;this.connecting=false;this.cloudDocs=[];this.merge();refresh();return}
    this.connecting=true;refresh();await this.pull();
  },
  rowOf(r){return{user_id:this.user.id,id:r.id,start_at:new Date(r.start).toISOString(),end_at:r.end?new Date(r.end).toISOString():null,part:r.part||null,title:r.title||'',source:r.from||'',exercises:r.ex}},
  recOf(r){return{id:String(r.id),v:2,start:Date.parse(r.start_at),end:r.end_at?Date.parse(r.end_at):null,part:r.part,title:r.title||'',from:r.source||'',ex:Array.isArray(r.exercises)?r.exercises:[]}},
  async pull(){
    if(!this.sb||!this.user)return;
    const {data,error}=await this.sb.from('workouts').select('id,start_at,end_at,part,title,source,exercises').order('start_at',{ascending:true});

  async upload(){

  async add(rec){

  async del(id){

      if(this.kind==='supa'&&this.user){const {error}=await this.sb.from('workouts').delete().eq('id',id);if(error){this.merge();refresh();return false}}

    }
    this.cloudDocs=this.cloudDocs.filter(x=>x.id!==id);this.merge();refresh();return true;
  },
  async signIn(email,password){const {error}=await this.sb.auth.signInWithPassword({email,password});if(error)throw error;return'in'},
  async signUp(email,password){const {data,error}=await this.sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;return data&&data.session?'in':'confirm'},
  async signOut(){try{await this.sb.auth.signOut()}catch(e){}this.onSession(null)}
};
function authMsg(e){

  if(/invalid_credentials|Invalid login/i.test(c))return'이메일이나 비밀번호가 맞지 않아요.';
  if(/email_not_confirmed|not confirmed/i.test(c))return'가입 확인 메일의 링크를 먼저 눌러 주세요.';
  if(/user_already_exists|already registered/i.test(c))return'이미 가입된 이메일이에요. "로그인"을 눌러 주세요.';
  if(/weak_password|Password should/i.test(c))return'비밀번호를 6자 이상으로 해 주세요.';
  if(/rate|429/i.test(c))return'너무 자주 시도했어요. 잠시 뒤 다시 해 주세요.';
  if(/email_address_invalid|invalid.*email/i.test(c))return'이메일 주소를 다시 확인해 주세요.';
  return'로그인하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.';
}

  if(Hist.sbFailed)return`<div class="card acct"><div><strong>계정 저장 서버에 연결하지 못했어요</strong><span>기록은 이 휴대폰에 저장되고, 다음에 열 때 다시 연결해요.</span></div></div>`;
  if(Hist.user)return`<div class="card acct"><div><strong>${esc(Hist.user.email||'로그인됨')}</strong><span>${Hist.cloud?'로그인됨 · 기록이 계정에 저장돼요':'계정에 연결하는 중이에요'}</span></div><button class="btn-light sm" data-auth="out">로그아웃</button></div>`;
  return`<div class="card acct"><div><strong>로그인하면 기록이 계정에 저장돼요</strong><span>휴대폰을 바꾸거나 컴퓨터에서 열어도 그대로 보여요.</span></div><button class="btn-dark sm" data-auth="open">로그인</button></div>`;
}
function authSheet(){
  openSheet('로그인 / 가입',`<form class="auth" id="authForm" novalidate>
    <label for="authEmail">이메일</label><input class="field" id="authEmail" type="email" autocomplete="email" inputmode="email" required>
    <label for="authPw">비밀번호 (6자 이상)</label><input class="field" id="authPw" type="password" autocomplete="current-password" minlength="6" required>
    <p class="msg" id="authMsg" role="status" aria-live="polite"></p>
    <button class="btn-dark" type="submit" data-authgo="in">로그인</button>
    <button class="btn-light" type="button" data-authgo="up">처음이에요 · 가입하기</button>
  </form>
  <p class="msg">이 휴대폰에 있던 기록은 로그인하면 계정으로 자동으로 옮겨져요. 가입하면 확인 메일이 갈 수 있어요. 메일의 링크를 누른 뒤 여기서 로그인해 주세요.</p>`);
  setTimeout(()=>{const el=document.getElementById('authEmail');if(el)el.focus()},50);
}
async function doAuth(mode){
  const em=document.getElementById('authEmail'),pw=document.getElementById('authPw'),msg=document.getElementById('authMsg');
  if(!em||!pw)return;
  const email=em.value.trim(),password=pw.value;
  if(!/^\S+@\S+\.\S+$/.test(email)){msg.textContent='이메일 주소를 다시 확인해 주세요.';em.focus();return}
  if(password.length<6){msg.textContent='비밀번호를 6자 이상으로 해 주세요.';pw.focus();return}
  const btns=sheetBody.querySelectorAll('[data-authgo]');btns.forEach(b=>b.disabled=true);msg.textContent=mode==='up'?'가입하는 중이에요…':'로그인하는 중이에요…';
  try{
    const r=mode==='up'?await Hist.signUp(email,password):await Hist.signIn(email,password);
    if(r==='confirm'){msg.textContent='확인 메일을 보냈어요. 메일의 링크를 누른 다음, 여기서 "로그인"을 눌러 주세요.';btns.forEach(b=>b.disabled=false);return}
    closeSheet();toast('로그인했어요 · 기록이 계정에 저장돼요');
  }catch(e){msg.textContent=authMsg(e);btns.forEach(b=>b.disabled=false)}
}
async function saveWorkout(){
  if(!ws)return;
  const rec={id:'w'+ws.start.toString(36),v:2,start:ws.start,end:ws.end||Date.now(),part:ws.part,from:String(ws.src||''),title:String(ws.title||'').slice(0,60),
    ex:ws.items.map(it=>({n:it.n,sets:it.sets.filter(s=>s.done).map(s=>({w:String(s.w),r:String(s.r)}))})).filter(x=>x.sets.length)};
  if(!rec.ex.length){toast('완료한 세트가 없어서 기록은 저장하지 않았어요');return}
  const ok=await Hist.add(rec);
  toast(ok?'오늘 운동을 기록에 저장했어요':'계정 저장이 잠깐 안 돼서 이 휴대폰에 먼저 저장했어요');
}
let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}
function refresh(){rebuild();if(wo.hidden&&sheet.hidden)render()}

/* ---------- 라우팅 & 이벤트 ---------- */
const view=document.getElementById('view');
function render(){
  document.querySelectorAll('.bnav button').forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  ({home:renderHome,history:renderHistory,library:renderLibrary})[ui.tab]();
  saveUi();
}
document.addEventListener('click',e=>{
  const t=e.target;
  const ab=t.closest('[data-authgo]');if(ab){e.preventDefault();if(!ab.disabled)doAuth(ab.dataset.authgo);return}
  if(t.closest('[data-close]')&&!t.closest('#lb')){closeSheet();return}
  const hit=t.closest('.hit');if(hit){showTip(hit);return}
  const b=t.closest('button');if(!b||b.disabled)return;
  if(b.closest('#lb')||b.closest('#rest'))return;
  const d=b.dataset;
  if(d.tab){ui.tab=d.tab;render();window.scrollTo(0,0);return}
  if(b.hasAttribute('data-anim')){toggleAnim(b);return}
  if(d.img){openLb(d.img,b.getAttribute('aria-label'));return}
  if(d.ex){exSheet(d.ex);return}
  if(d.sess){sessSheet(d.sess);return}
  if(d.auth==='open'){authSheet();return}
  if(d.auth==='out'){Hist.signOut().then(()=>toast('로그아웃했어요 · 이제 이 휴대폰에 저장돼요'));return}
  if(d.go){if(!armReplace(b))return;startFromSess(byId[d.go]);return}
  if(d.part){ui.part=d.part;ui.sid=null;render();return}
  if(d.lp){ui.lp=d.lp;document.querySelectorAll('#lp button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.lp===ui.lp));fillLibrary();saveUi();return}
  if(d.act==='start'){startFromSess(curSess());return}
  if(d.act==='resume'){openWorkout();return}
  if(d.act==='build'){openBuild();return}
  if(d.act==='finish'){finishSheet();return}
  if(d.act==='cancelask'){if(ws)cancelSheet();return}
  if(d.editrec){editRec(d.editrec);return}
  if(er&&d.epart){er.part=d.epart;er.title=String(er.title||'').replace(/^(어깨|하체|가슴|등|OT)/,PARTS[d.epart]);sheet.querySelector('.sheet').setAttribute('style',pc(er.part));rerenderEdit();return}
  if(er&&d.edelex!==undefined){er.ex.splice(+d.edelex,1);rerenderEdit();return}
  if(er&&d.edelset){const [ei,si]=d.edelset.split(':').map(Number);er.ex[ei].sets.splice(si,1);if(!er.ex[ei].sets.length)er.ex.splice(ei,1);rerenderEdit();return}
  if(er&&d.eaddset!==undefined){const x=er.ex[+d.eaddset],l=x.sets[x.sets.length-1]||{w:'',r:'12'};x.sets.push({w:l.w,r:l.r});rerenderEdit();return}
  if(er&&b.hasAttribute('data-esave')){saveEdit();return}
  if(d.act==='cancelgo'){cancelWorkout();return}
  if(d.act==='endpartial'){ws.finished=true;ws.end=Date.now();saveWs();closeSheet();if(!wo.hidden)closeWorkout();else render();saveWorkout();return}
  if(b.hasAttribute('data-resttgl')){restAuto=!restAuto;store.set('ptnote-rest-auto',restAuto);if(!restAuto)stopRest();b.setAttribute('aria-pressed',restAuto);b.lastChild.textContent=`체크하면 휴식 타이머 시작 · ${restAuto?'켜짐':'꺼짐'}`;toast(restAuto?'세트를 체크하면 휴식 타이머가 시작돼요':'휴식 타이머를 껐어요');return}
  if(d.act==='end'){ws.finished=true;ws.end=Date.now();saveWs();closeSheet();closeWorkout();saveWorkout();return}
  if(d.del){if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='한 번 더 누르면 지워져요';setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent='이 기록 지우기'}},3000);return}
    closeSheet();Hist.del(d.del).then(ok=>toast(ok?'기록을 지웠어요':'지우지 못했어요. 잠시 뒤 다시 해 주세요'));return}
  /* 루틴 만들기 */
  if(d.cnt){const k=+d.cnt;bd.count=k;if(bd.sel.length>k){bd.sel=orderEx(bd.sel).slice(0,k);toast(`${k}개만 남겼어요`)}renderBuild();return}
  if(d.bpart){bd.part=d.bpart;bd.v=0;renderBuild();return}
  if(d.bd==='shuffle'){bd.v++;renderBuild();return}
  if(d.bd==='userec'){bd.sel=recommend(bd.part,bd.count,bd.v);renderBuild();toast('추천 운동을 골랐어요. 아래에서 무게·횟수를 확인해 주세요');return}
  if(d.bsel){const n=d.bsel,i=bd.sel.indexOf(n);if(i>=0)bd.sel.splice(i,1);else{if(bd.sel.length>=bd.count){toast(`${bd.count}개를 다 골랐어요. 하나를 빼거나 개수를 늘려 주세요`);return}bd.sel.push(n)}renderBuild();return}
  if(d.bunsel){bd.sel=bd.sel.filter(x=>x!==d.bunsel);renderBuild();return}
  if(d.stp){const c=cfgOf(d.n),dir=+d.d;if(d.stp==='sets')c.sets=Math.min(8,Math.max(1,c.sets+dir));else if(d.stp==='r')c.r=Math.min(50,Math.max(1,(+c.r||0)+dir));else c.w=stepKg(c.w,dir);renderBuild();return}
  /* 운동 중 바꾸기 */
  if(b.classList.contains('chk')){const st=ws.items[+d.ei].sets[+d.si];st.done=!st.done;saveWs();b.setAttribute('aria-pressed',st.done);b.closest('.st').classList.toggle('done',st.done);updProgress();if(st.done&&!ws.finished&&restAuto)startRest(90);return}
  if(d.wset!==undefined){const it=ws.items[+d.wset];if(+d.d>0){const l=it.sets[it.sets.length-1]||{w:'',r:'12'};it.sets.push({w:l.w,r:l.r,done:false})}else if(it.sets.length>1)it.sets.pop();saveWs();renderWorkout();return}
  if(d.wswap!==undefined){exPicker('swap',+d.wswap);return}
  if(b.hasAttribute('data-wadd')){exPicker('add',-1);return}
  if(d.xpp){exPicker(xp.mode,xp.ei,d.xpp);return}
  if(d.xpick){const n=d.xpick;if(xp.mode==='swap')ws.items[xp.ei]=newItem(n,ws.items[xp.ei].sets.length);else ws.items.push(newItem(n));saveWs();closeSheet();renderWorkout();toast(`${xp.mode==='swap'?'운동을 바꿨어요':'운동을 추가했어요'} · ${n}`);return}
  if(d.wdel!==undefined){ws.items.splice(+d.wdel,1);saveWs();closeSheet();renderWorkout();toast('운동을 뺐어요');return}
});
document.getElementById('bdClose').addEventListener('click',closeBuild);
bdStart.addEventListener('click',()=>{if(bdStart.disabled||!armReplace(bdStart))return;startCustom()});
bdBody.addEventListener('change',e=>{const i=e.target.closest('[data-bw]');if(!i)return;cfgOf(i.dataset.bw).w=i.value.trim();saveBd()});
document.getElementById('woClose').addEventListener('click',closeWorkout);
document.getElementById('woFinish').addEventListener('click',finishSheet);
document.getElementById('lbx').addEventListener('click',closeLb);
sheetBody.addEventListener('change',e=>{
  if(!er)return;const i=e.target;
  if(i.dataset.eei!==undefined){er.ex[+i.dataset.eei].sets[+i.dataset.esi][i.dataset.ef]=i.value;return}
  if(i.id==='eDate'&&i.value){const [y,m,dd]=i.value.split('-').map(Number),old=new Date(er.start),nd=new Date(old);nd.setFullYear(y,m-1,dd);const diff=nd-old;er.start+=diff;if(er.end)er.end+=diff;return}
  if(i.id==='eAdd'&&i.value){const it=newItem(i.value);er.ex.push({n:it.n,sets:it.sets.map(s=>({w:s.w,r:s.r}))});rerenderEdit();return}
});
woList.addEventListener('change',e=>{const i=e.target.closest('.cell');if(!i||i.dataset.ei===undefined)return;
  const ei=i.dataset.ei,it=ws.items[+ei],si=+i.dataset.si,f=i.dataset.f,old=it.sets[si][f],val=i.value.trim();it.sets[si][f]=val;
  /* 아래쪽 아직 안 한 세트도 같은 값이었으면 같이 바꿔줘요 */
  for(let j=si+1;j<it.sets.length;j++){const s=it.sets[j];if(!s.done&&s[f]===old){s[f]=val;const el=woList.querySelector(`.cell[data-ei="${ei}"][data-si="${j}"][data-f="${f}"]`);if(el)el.value=val}}
  saveWs()});
view.addEventListener('input',e=>{if(e.target.id==='q')fillLibrary()});
sheetBody.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();doAuth('in')}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!lb.hidden)closeLb();else if(!sheet.hidden)closeSheet();else if(!bdEl.hidden)closeBuild()});

render();
Hist.init();
</script>

<style>
.upd{position:fixed;inset:0;z-index:80;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.upd-card{width:100%;max-width:440px;background:var(--surface);color:var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 40px rgb(0 0 0 / .3)}
.upd-card h2{font-size:19px;font-weight:700}
.upd-card p{font-size:14.5px;color:var(--muted);line-height:1.55}
.upd-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:8px}
</style>
<script>
/* 새 버전 알림: 새 버전을 받아 두면 "업데이트할까요?"를 묻고, 확인하면 바로 바꿔요. */
(()=>{
  if(!('serviceWorker' in navigator))return;
  if(!(location.protocol==='https:'||location.hostname==='localhost'))return;
  let reloading=false,open=false,lastNo=0;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
  function ask(reg){
    if(open||!reg.waiting||!navigator.serviceWorker.controller)return;
    if(Date.now()-lastNo<30*60*1000)return; /* 취소하면 30분 동안은 다시 묻지 않아요 */
    open=true;
    const el=document.createElement('div');el.className='upd';
    el.innerHTML='<section class="upd-card" role="dialog" aria-modal="true" aria-labelledby="updT"><h2 id="updT">새 버전이 있어요</h2><p id="updN">업데이트하면 새 기능이 바로 적용돼요.</p><p>운동 기록과 진행 중인 운동은 그대로 남아요.</p><div class="upd-btns"><button class="btn-light" id="updNo">취소</button><button class="btn-dark" id="updYes">업데이트</button></div></section>';
    document.body.appendChild(el);document.getElementById('updYes').focus();
    fetch('version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v&&v.notes)document.getElementById('updN').textContent=v.notes}).catch(()=>{});
    document.getElementById('updNo').onclick=()=>{lastNo=Date.now();open=false;el.remove()};
    document.getElementById('updYes').onclick=e=>{
      const w=reg.waiting;e.target.disabled=true;e.target.textContent='업데이트 중…';
      if(w)w.postMessage({type:'SKIP_WAITING'});else location.reload();
    };
  }
  navigator.serviceWorker.register('sw.js').then(reg=>{
    ask(reg);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')ask(reg)})});
    const check=()=>reg.update().then(()=>ask(reg)).catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    setTimeout(check,1500);
  }).catch(()=>{});
})();
</script>
